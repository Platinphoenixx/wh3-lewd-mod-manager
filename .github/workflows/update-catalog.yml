# Keeps the catalog current without anyone's involvement: re-reads LoversLab and Steam, adds automatic
# entries for new mods, rebuilds catalog/catalog.json and commits it. Apps pick it up via catalogUrl.
name: Update catalog

on:
  schedule:
    - cron: '17 4 * * 1'   # weekly, Monday 04:17 UTC (off the full hour to spread load)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r curator/requirements.txt
      - name: Update
        run: python curator/update.py
      - name: Commit if anything changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add catalog/catalog.json curator/raw curator/work/auto-new.json CHANGES.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Catalog update $(date -u +%Y-%m-%d)" -m "$(head -c 3000 CHANGES.md)"
          git push
