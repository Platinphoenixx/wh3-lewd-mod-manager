# The Linux version (AppImage, beta, the "Potentially Shitty Vibecoded Version"). Windows comes first: the Linux version
# is only rebuilt when it needs a fix or every few releases, so this runs only by hand (Actions → Linux build → Run
# workflow). It builds the branch it is started on (main), so a Linux fix made after a release can go out without a new
# Windows release: with a release tag (e.g. v0.2.5) the AppImage is attached to that release (replacing one of the same
# name); without one it is kept as the run's artifact for testers. Built on Linux, so the programs it carries (7-Zip, Steam's library) keep their
# "executable" mark, which a build on Windows would lose.
name: Linux build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the AppImage to (e.g. v0.2.5); empty = only keep it as an artifact'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The tests are written on Windows; a test that only fails because of Linux paths must not hold back the AppImage.
      - run: npm test
        continue-on-error: true
      - run: npm run dist:linux
      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" release/*.AppImage --clobber
      - name: Keep for testers
        if: inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: wh3-lewd-mod-manager-linux-potentially-shitty-vibecoded-version
          path: app/release/*.AppImage
          retention-days: 30
